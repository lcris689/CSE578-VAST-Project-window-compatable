        <div class="cnt">
            <br><h1 class="text-center">Identifying Distinct Area and Popularity</h1>

                    <div id="filter" style="justify-content: center;">
                        <div class="radioLabel">
                            <input type="radio" id="Monday" name="dayOfWeek" value="2" checked="checked" hidden>

                        </div>    
                        <div class="radioLabel"><input class="radioInput" type="radio" id="Tuesday" name="dayOfWeek" value="3" hidden><label for="Tuesday">Tuesday</label></div>

                        <div class="radioLabel"><input type="radio" id="Friday" name="dayOfWeek" value="6" hidden><label for="Friday">Friday</label></div> 
                        <div class="radioLabel"><input type="radio" id="Saturday" name="dayOfWeek" value="7" hidden><label for="Saturday">Saturday</label></div>
                        <div class="radioLabel"><input type="radio" id="Sunday" name="dayOfWeek" value="1" hidden><label for="Sunday">Sunday</label></div>
